apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Shrink, optimise and obfuscate release builds with R8 (and drop unused
 * resources). React Native and the libraries ship their own keep rules; the
 * app's extra rules are in proguard-rules.pro. The mapping file needed to read
 * crash stack traces is packed into the app bundle for Play Console.
 */
def enableProguardInReleaseBuilds = true

/**
 * Version: mobile/package.json "version" is the single source of truth (the
 * Settings screen shows the same value). Google Play needs a versionCode that
 * grows with every upload, so it is derived from it: 1.2.3 → 10203.
 */
def appVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version as String
def versionParts = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionParts.matches()) {
    throw new GradleException("mobile/package.json version must look like 1.2.3, got '${appVersion}'")
}
def (versionMajor, versionMinor, versionPatch) = (1..3).collect { versionParts.group(it) as int }
if (versionMinor > 99 || versionPatch > 99) {
    throw new GradleException("Minor and patch versions must stay below 100 to fit the versionCode scheme, got '${appVersion}'")
}
def appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

/**
 * Release signing. Google Play only accepts builds signed with your private
 * upload key. Pass its four values as Gradle properties (for
 * example in ~/.gradle/gradle.properties) or environment variables. Without
 * them, release builds fall back to the debug key: fine for testing on a
 * device, rejected by Google Play.
 */
def uploadKeySetting = { String name -> (findProperty(name) ?: System.getenv(name)) as String }
def uploadKey = [
    storeFile    : uploadKeySetting("KONPDF_UPLOAD_STORE_FILE"),
    storePassword: uploadKeySetting("KONPDF_UPLOAD_STORE_PASSWORD"),
    keyAlias     : uploadKeySetting("KONPDF_UPLOAD_KEY_ALIAS"),
    keyPassword  : uploadKeySetting("KONPDF_UPLOAD_KEY_PASSWORD"),
]
def hasUploadKey = uploadKey.values().every { it }
if (hasUploadKey && !file(uploadKey.storeFile).isFile()) {
    throw new GradleException("KONPDF_UPLOAD_STORE_FILE points to '${uploadKey.storeFile}', which doesn't exist")
}
if (!hasUploadKey && gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
    logger.warn("KonPDF: no upload key configured (KONPDF_UPLOAD_* properties), so this release build is " +
        "signed with the debug key. It installs on devices but Google Play will reject it.")
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // The store ID (applicationId) can never change once the app is on Google Play.
    namespace "com.konpdf"
    defaultConfig {
        applicationId "io.github.gauravtiwari31.konpdf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            release {
                storeFile file(uploadKey.storeFile)
                storePassword uploadKey.storePassword
                keyAlias uploadKey.keyAlias
                keyPassword uploadKey.keyPassword
            }
        }
    }
    packagingOptions {
        jniLibs {
            // Compress native code in the APK: llama.rn (Developer Mode's AI
            // reader) ships one build per CPU generation, ~12 MB each unpacked.
            useLegacyPackaging true
            // Its Qualcomm NPU/GPU build needs extra system libraries we don't
            // request; phones fall back to the fastest plain-CPU build instead.
            excludes += ["**/librnllama_v8_2_dotprod_i8mm_hexagon_opencl.so", "**/librnllama_jni_v8_2_dotprod_i8mm_hexagon_opencl.so"]
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Pack native debug symbols into the bundle so Play Console can
            // show readable native crash reports.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

// llama.rn copies its Qualcomm NPU libraries into the app's assets; KonPDF
// doesn't use the NPU (see packagingOptions), so skip the copy.
tasks.configureEach { task ->
    if (task.name == "syncRNLlamaHtpAssets") {
        task.enabled = false
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Scan tab: Google's document scanner and text reader. Both run through
    // Google Play services, which download their models, so the APK stays small.
    implementation("com.google.android.gms:play-services-base:18.11.0")
    implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0")
    implementation("com.google.android.gms:play-services-mlkit-text-recognition:19.0.1")
    implementation("com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
